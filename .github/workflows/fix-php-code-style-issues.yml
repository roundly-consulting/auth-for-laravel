name: Check PHP code style

on:
  workflow_dispatch:

jobs:
  php-code-styling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check PHP code style (Pint)
        uses: aglipanci/laravel-pint-action@2.6
        with:
          args: --test
