version: 2
# composer resolves the private roundly-consulting/* VCS deps; Dependabot has
# org access granted to those repos so the composer job can build the graph.
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
